<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jono Eats - Checkout</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Our CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                🍔 Jono Eats
            </a>

            <a href="cart.html" class="btn btn-warning">
                🛒 Back to Cart
            </a>
        </div>
    </nav>


    <!-- Checkout Section -->
    <section class="container py-5">

        <h1 class="mb-4">Checkout</h1>

        <div class="row">

            <!-- Customer Details -->
            <div class="col-lg-7">

                <div class="card p-4">

                    <h3 class="mb-4">Delivery Details</h3>

                    <form id="checkoutForm">

                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input
                                type="text"
                                id="name"
                                class="form-control"
                                placeholder="Enter your name"
                                required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Phone Number</label>
                            <input
                                type="tel"
                                id="phone"
                                class="form-control"
                                placeholder="Enter phone number"
                                required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input
                                type="email"
                                id="email"
                                class="form-control"
                                placeholder="Enter email"
                                required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Delivery Address</label>
                            <textarea
                                id="address"
                                class="form-control"
                                rows="4"
                                placeholder="Enter complete address"
                                required></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Payment Method</label>

                            <select id="payment" class="form-select" required>
                                <option value="">Select Payment Method</option>
                                <option value="COD">Cash on Delivery</option>
                                <option value="UPI">UPI</option>
                                <option value="CARD">Debit / Credit Card</option>
                            </select>
                        </div>

                        <button type="submit" class="btn btn-warning w-100">
                            Place Order
                        </button>

                    </form>

                </div>

            </div>


            <!-- Order Summary -->
            <div class="col-lg-5">

                <div class="card p-4">

                    <h3>Order Summary</h3>

                    <hr>

                    <div id="checkoutItems"></div>

                    <hr>

                    <div class="d-flex justify-content-between">
                        <span>Subtotal</span>
                        <strong id="checkoutSubtotal">₹0</strong>
                    </div>

                    <div class="d-flex justify-content-between mt-2">
                        <span>Delivery</span>
                        <strong id="checkoutDelivery">₹0</strong>
                    </div>

                    <hr>

                    <div class="d-flex justify-content-between">
                        <h5>Total</h5>
                        <h5 id="checkoutTotal">₹0</h5>
                    </div>

                </div>

            </div>

        </div>

    </section>


    <!-- JavaScript -->
    <script src="js/checkout.js"></script>

</body>

</html>
