<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jono Eats - Menu</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Our CSS -->
    <link
        rel="stylesheet"
        href="css/style.css">

</head>


<body>


<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a
            class="navbar-brand fw-bold"
            href="index.html">

            🍔 Jono Eats

        </a>


        <a
            href="cart.html"
            class="btn btn-warning">

            🛒 Cart

            <span id="cartCount">
                0
            </span>

        </a>

    </div>

</nav>



<!-- ================= MENU ================= -->

<section class="container py-5">

    <h1 class="text-center mb-4">

        Our Menu 🍔

    </h1>


    <p class="text-center text-muted mb-5">

        Choose your favorite food

    </p>



    <!-- SEARCH -->

    <div class="row mb-5">

        <div class="col-md-6 mx-auto">

            <input
                type="text"
                id="searchInput"
                class="form-control"
                placeholder="🔍 Search food...">

        </div>

    </div>



    <!-- FOOD CARDS -->

    <div
        class="row g-4"
        id="foodContainer">

    </div>


</section>



<!-- ================= JAVASCRIPT ================= -->

<script src="js/menu.js"></script>


</body>

</html>
